# Production stack on the shared app server (api.studiospars.com).
# The host's system Caddy terminates TLS and reverse-proxies to WEB_PORT on
# loopback (see deploy/Caddyfile.snippet). PostgreSQL and Redis live on
# database.selamet.dev / redis.selamet.dev and are reached over TLS.
name: pars-studio-api

services:
  web:
    build: .
    image: pars-studio-api:latest
    container_name: pars-studio-api
    restart: unless-stopped
    env_file: .env
    ports:
      - "127.0.0.1:${WEB_PORT:-8108}:8000"
    volumes:
      - media:/app/media

  worker:
    image: pars-studio-api:latest
    container_name: pars-studio-api-worker
    restart: unless-stopped
    env_file: .env
    command: ["python", "manage.py", "db_worker", "--queue-name", "default"]
    # The image's HEALTHCHECK curls the web port, which the worker does not serve.
    # The worker only needs its task queue, so check that the database is reachable.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import django; django.setup(); from django.db import connection; connection.ensure_connection()"
      interval: 60s
      timeout: 15s
      start_period: 30s
      retries: 3
    volumes:
      - media:/app/media
    depends_on:
      web:
        condition: service_healthy

volumes:
  # Only used when R2 is not configured.
  media:
